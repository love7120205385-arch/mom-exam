<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金融市場常識與職業道德｜順序隨機測驗（100 題）</title>
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-light: #eef4fb;
      --accent: #991b1b;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #4b5563;
      --border: #d1d5db;
      --ok-bg: #dcfce7;
      --ok-bd: #16a34a;
      --ok-ink: #14532d;
      --err-bg: #fee2e2;
      --err-bd: #dc2626;
      --err-ink: #7f1d1d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', 'Inter', sans-serif;
      line-height: 1.55;
    }
    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 18px 16px 64px;
    }
    .header {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 5px solid var(--primary);
      border-radius: 14px;
      padding: 18px 22px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
    }
    .header h1 {
      margin: 0 0 10px;
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      font-weight: 900;
      color: var(--primary);
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      appearance: none;
      border: 1.5px solid var(--primary);
      background: #ffffff;
      color: var(--primary);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { background: var(--primary-light); }
    .btn.active, .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover { background: #162c49; }
    .score-pill {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #bfdbfe;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 7px 14px;
      border-radius: 999px;
    }
    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .q-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .q-line {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .q-blank {
      display: inline-block;
      min-width: 44px;
      text-align: center;
      border-bottom: 2.5px solid var(--primary);
      color: var(--primary);
      font-weight: 900;
      margin: 0 4px;
      padding: 0 4px;
    }
    .q-blank.ok { color: var(--ok-ink); border-color: var(--ok-bd); background: var(--ok-bg); border-radius: 4px; }
    .q-blank.err { color: var(--err-ink); border-color: var(--err-bd); background: var(--err-bg); border-radius: 4px; }
    .hl {
      background-color: #fff176;
      color: #000000;
      font-weight: 800;
      padding: 0 4px;
      border-radius: 3px;
      box-shadow: inset 0 -2px 0 #fdd835;
    }
    .opts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }
    .opt-btn {
      appearance: none;
      text-align: left;
      background: #f9fafb;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 1.12rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      line-height: 1.45;
      transition: all 0.12s ease;
    }
    .opt-btn:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .opt-btn.correct {
      background: var(--ok-bg);
      border-color: var(--ok-bd);
      color: var(--ok-ink);
      font-weight: 800;
    }
    .opt-btn.wrong {
      background: var(--err-bg);
      border-color: var(--err-bd);
      color: var(--err-ink);
    }
    .feedback-row {
      margin-top: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .fb-ok { color: var(--ok-ink); }
    .fb-err { color: var(--err-ink); }
    .hook-tag { color: var(--accent); font-weight: 800; }
    .empty-msg {
      background: var(--card);
      border: 1px dashed var(--border);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      font-size: 1.15rem;
      color: var(--muted);
    }
  </style>
</head>

  <div class="container">
    <header class="header">
      <h1>金融市場常識與職業道德｜順序隨機測驗（100 題）</h1>
      <div class="toolbar">
        <div class="btn-group">
          <button type="button" class="btn btn-primary" id="shuffleBtn">重新隨機出題</button>
          <button type="button" class="btn active" id="allBtn">全部題目</button>
          <button type="button" class="btn" id="wrongBtn">只看答錯</button>
        </div>
        <div class="score-pill" id="scorePill">已作答 0 / 100 題 ｜ 答對 0 題</div>
      </div>
    </header>
    <main class="quiz-list" id="quizList"></main>
  </div>

  <script>
    const RAW_QUESTIONS = [{"id": 1, "ans": "B", "q": "一般而言，金融市場依工具到期期間長短，以幾年為界分為貨幣市場與資本市場？", "kws": ["幾年為界", "貨幣市場與資本市場"], "opts": {"A": "半年", "B": "一年", "C": "二年", "D": "三年"}, "hook": "【★ 1年切一半：↓1年貨幣／↑1年資本】"}, {"id": 2, "ans": "C", "q": "下列何者屬於「資本市場」的交易工具？", "kws": ["資本市場"], "opts": {"A": "國庫券", "B": "商業本票", "C": "公司債", "D": "銀行承兌匯票"}, "hook": ""}, {"id": 3, "ans": "A", "q": "政府或企業首次公開發行有價證券，以募集資金的市場稱為？", "kws": ["首次公開發行"], "opts": {"A": "發行市場（初級市場）", "B": "流通市場（次級市場）", "C": "拆款市場", "D": "外匯市場"}, "hook": "【★ 首次＝初戀＝初級】"}, {"id": 4, "ans": "D", "q": "下列何者「不是」中央銀行執行貨幣政策的主要工具？", "kws": ["「不是」", "貨幣政策"], "opts": {"A": "公開市場操作", "B": "調整重貼現率", "C": "調整存款準備率", "D": "調整所得稅稅率"}, "hook": "【✗ 所得稅＝財政部，非央行】"}, {"id": 5, "ans": "C", "q": "銀行審查企業授信案件時所依據的「5P 原則」，不包含下列哪一項？", "kws": ["5P 原則", "不包含"], "opts": {"A": "借款戶（People）", "B": "資金用途（Purpose）", "C": "獲利能力（Profit）", "D": "債權保障（Protection）"}, "hook": "【✗ 5P看人不看「獲利」】"}, {"id": 6, "ans": "A", "q": "當中央銀行採取「緊縮性貨幣政策」調升重貼現率時，通常會造成下列何種現象？", "kws": ["緊縮性貨幣政策", "調升重貼現率"], "opts": {"A": "市場利率上升，資金趨緊", "B": "市場利率下降，資金寬鬆", "C": "銀行放款大幅增加", "D": "新台幣大幅貶值"}, "hook": "【↑ 調升利率 → 資金緊↓】"}, {"id": 7, "ans": "C", "q": "我國目前金融機構（銀行、證券、保險）的最高監理主管機關為？", "kws": ["最高監理主管機關"], "opts": {"A": "中央銀行", "B": "財政部", "C": "金融監督管理委員會", "D": "公平交易委員會"}, "hook": "【★ 金管會＝金融老大】"}, {"id": 8, "ans": "C", "q": "中央存款保險公司對每一存款人在同一家要保機構之最高保額為新台幣多少元？", "kws": ["中央存款保險", "最高保額"], "opts": {"A": "100 萬元", "B": "200 萬元", "C": "300 萬元", "D": "500 萬元"}, "hook": "【★ 存保最高賠 300 萬】"}, {"id": 9, "ans": "D", "q": "關於「可轉讓定期存單（NCD）」的敘述，下列何者錯誤？", "kws": ["可轉讓定期存單", "錯誤"], "opts": {"A": "屬於貨幣市場工具", "B": "具備高度流動性，可於次級市場轉讓", "C": "發行期間最長不超過一年", "D": "記名式發行，絕對不可轉讓"}, "hook": "【✓ 有「可轉讓」就能轉】"}, {"id": 10, "ans": "B", "q": "下列何種金融機構的主要業務為辦理短期票券之簽證、承銷、經紀及自營？", "kws": ["短期票券"], "opts": {"A": "商業銀行", "B": "票券金融公司", "C": "證券投資信託公司", "D": "人壽保險公司"}, "hook": ""}, {"id": 11, "ans": "C", "q": "投資人持有「普通股」所享有的權利，不包括下列何者？", "kws": ["普通股", "不包括"], "opts": {"A": "盈餘分派權", "B": "股東會表決權", "C": "優先受償固定利息權",  "C": "可轉讓定期存單", "D": "政府公債"}, "hook": ""}, {"id": 23, "ans": "C", "q": "財產保險中，被保險人不得因保險事故發生而獲得超過實際損害之賠償，此為何種原則？", "kws": ["超過實際損害"], "opts": {"A": "最大誠信原則", "B": "保險利益原則", "C": "損害填補原則", "D": "主力近因原則"}, "hook": ""}, {"id": 24, "ans": "C", "q": "下列何種保險契約「不適用」損害填補原則？", "kws": ["「不適用」損害填補原則"], "opts": {"A": "住宅火災保險", "B": "汽車第三人責任險", "C": "人壽保險", "D": "海上貨物運輸保險"}, "hook": "【✗ 人命無價 → 人壽不適用】"}, {"id": 25, "ans": "A", "q": "依我國保險法規定，人壽保險契約中，誰有權指定或變更身故受益人？", "kws": ["指定或變更身故受益人"], "opts": {"A": "要保人", "B": "被保險人", "C": "保險公司", "D": "保險業務員"}, "hook": ""}, {"id": 26, "ans": "B", "q": "人壽保險契約訂立後，要保人於收到保單翌日起算幾日內，得以書面檢同保險單向保險公司撤銷契約？", "kws": ["幾日內", "撤銷契約"], "opts": {"A": "7 日", "B": "10 日", "C": "14 日", "D": "30 日"}, "hook": "【★ 十天鑑賞期】"}, {"id": 27, "ans": "D", "q": "購買「投資型保險」時，其專設帳簿資產的投資損益與風險由誰承擔？", "kws": ["投資型保險", "風險由誰承擔"], "opts": {"A": "保險公司", "B": "保管銀行", "C": "保險業務員", "D": "要保人（保戶）"}, "hook": "【★ 投資賺賠保戶自己扛】"}, {"id": 28, "ans": "C", "q": "下列何者屬於「非系統性風險」（公司特有風險），可透過分散投資組合加以降低？", "kws": ["非系統性風險"], "opts": {"A": "戰爭爆發", "B": "通貨膨脹率飆升", "C": "單一上市公司工廠發生大火", "D": "中央銀行全面升息"}, "hook": "【★ 單一公司失火自己倒楣】"}, {"id": 29, "ans": "A", "q": "衡量單一股票或投資組合相對於整體市場波動程度的系統性風險指標為何？", "kws": ["系統性風險指標"], "opts": {"A": "貝他係數（Beta）", "B": "本益比（P/E）", "C": "股價淨值比（P/B）", "D": "流動比率"}, "hook": "【★ 看大盤波動＝Beta】"}, {"id": 30, "ans": "A", "q": "當新台幣對美元匯率由 31.5 元貶值為 32.8 元時，對台灣哪一類企業較為有利？", "kws": ["貶值"], "opts": {"A": "以外銷為主的出口商", "B": "向國外採購原物料的進口商", "C": "計畫出國留學的學生", "D": "償還外幣債務的企業"}, "hook": "【↓ 台幣貶 → 外銷出口賺↑】"}, {"id": 31, "ans": "A", "q": "銀行執行防制洗錢作業時，對客戶進行身分確認與背景審查的程序簡稱為何？", "kws": ["防制洗錢", "身分確認"], "opts": {"A": "KYC", "B": "KYP", "C": "CSR", "D": "KPI"}, "hook": "【★ KYC＝肯德基認識客戶】"}, {"id": 32, "ans": "B", "q": "金融機構發現疑似洗錢之交易時，依法應向哪一個機關辦理申報？", "kws": ["疑似洗錢", "申報"], "opts": {"A": "金融監督管理委員會", "B": "法務部調查局", "C": "內政部警政署", "D": "中央銀行"}, "hook": "【★ 抓洗錢找調查局】"}, {"id": 33, "ans": "C", "q": "關於將個人銀行帳戶、提款卡及密碼交給陌生人或詐騙集團使用，下列敘述何者正確？", "kws": ["帳戶", "交給陌生人"], "opts": {"A": "只要自己沒有直接去騙人就完全無罪", "B": "屬於單     let order = [];
    let answers = {};
    let showWrongOnly = false;

    const quizList = document.getElementById('quizList');
    const scorePill = document.getElementById('scorePill');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const allBtn = document.getElementById('allBtn');
    const wrongBtn = document.getElementById('wrongBtn');

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function highlightKeywords(text, kws) {
      let esc = escapeHtml(text);
      if (!kws || kws.length === 0) return esc;
      for (const kw of kws) {
        const kEsc = escapeHtml(kw);
        if (kEsc) esc = esc.split(kEsc).join('<span class="hl">' + kEsc + '</span>');
      }
      return esc;
    }

    function shuffleQuestions() {
      order = RAW_QUESTIONS.map((_, idx) => idx);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      answers = {};
      showWrongOnly = false;
      allBtn.classList.add('active');
      wrongBtn.classList.remove('active');
      render();
    }

    function updateScore() {
      let answered = 0;
      let correct = 0;
      for (const q of RAW_QUESTIONS) {
        if (answers[q.id]) {
          answered++;
          if (answers[q.id] === q.ans) correct++;
        }
      }
      scorePill.textContent = `已作答 ${answered} / 100 題 ｜ 答對 ${correct} 題`;
    }

    function render() {
      updateScore();
      quizList.innerHTML = '';
      const list = order.map((idx) => RAW_QUESTIONS[idx]).filter((q) => {
        if (!showWrongOnly) return true;
        return answers[q.id] && answers[q.id] !== q.ans;
      });

      if (list.length === 0) {
        quizList.innerHTML = '<div class="empty-msg">目前沒有答錯的題目，繼續保持！</div>';
        return;
      }

      list.forEach((q, displayIdx) => {
        const picked = answers[q.id] || '';
        const isCorrect = picked === q.ans;
        const card = document.createElement('div');
        card.className = 'q-card';

        let blankClass = 'q-blank';
        if (picked) blankClass += isCorrect ? ' ok' : ' err';

        const qHtml = highlightKeywords(q.q, q.kws);
        const optsHtml = ['A', 'B', 'C', 'D'].map((letter) => {
          let cls = 'opt-btn';
          if (picked) {
            if (letter === q.ans) cls += ' correct';
            else if (letter === picked) cls += ' wrong';
          }
          return `<button type="button" class="${cls}" data-qid="${q.id}" data-opt="${letter}">(${letter}) ${escapeHtml(q.opts[letter])}</button>`;
        }).join('');

        let fbHtml = '';
        if (picked) {
          const msg = isCorrect
            ? `<span class="fb-ok">✓ 答對了！正確答案：(${q.ans})</span>`
            : `<span class="fb-err">✗ 答錯囉，正確答案是：(${q.ans})</span>`;
          const hook = q.hook ? `<span class="hook-tag">${escapeHtml(q.hook)}</span>` : '';
          fbHtml = `<div class="feedback-row">${msg}${hook}</div>`;
        }

        card.innerHTML = `
          <div class="q-line">
            <span>第 ${displayIdx + 1} 題</span>
            <span class="${blankClass}">${picked || '？'}</span>
            <span>${qHtml}</span>
          </div>
          <div class="opts-grid">${optsHtml}</div>
          ${fbHtml}
        `;
        quizList.appendChild(card);
      });
    }

    quizList.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-qid]');
      if (!btn) return;
      const qid = Number(btn.dataset.qid);
      const opt = btn.dataset.opt;
      answers[qid] = opt;
      render();
    });

    shuffleBtn.addEventListener('click', shuffleQuestions);

    allBtn.addEventListener('click', () => {
      showWrongOnly = false;
      allBtn.classList.add('active');
      wrongBtn.classList.remove('active');
      render();
    });

    wrongBtn.addEventListener('click', () => {
      showWrongOnly = true;
      wrongBtn.classList.add('active');
      allBtn.classList.remove('active');
      render();
    });

    shuffleQuestions();
  </script>
</body>
</html>
